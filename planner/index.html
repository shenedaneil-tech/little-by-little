<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fcf9f5">
<meta name="description" content="A gentle daily planner that picks your next little thing and connects your errands into a route.">
<title>Little by Little · Your day, gently</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* ---------- Tokens ---------- */
:root{
  --ink:#2f2a3d;--muted:#6f6881;--bg:#fcf9f5;--surface:#fff;--line:#ebe4f0;
  --plum:#5a4380;--plum-hi:#6c52a0;--lilac:#f3ecfa;--lilac-2:#e7ddf5;
  --sage:#e4eed9;--leaf:#8fb07a;--peach:#f7dcc3;--peach-bg:#fdf1e5;--peach-ink:#7b4e39;--clay:#96543c;
  --r-lg:28px;--r:22px;--r-sm:14px;
  --shadow:0 1px 2px #3c285a0d,0 10px 28px -14px #3c285a38;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --font:Nunito,ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"Segoe UI",sans-serif;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-bottom:120px}
body{margin:0;min-height:100dvh;font:400 15px/1.5 var(--font);color:var(--ink);background:radial-gradient(46rem 24rem at 100% -6%,#f0e6fa,transparent 70%) no-repeat,var(--bg)}
body:has(dialog[open]){overflow:hidden}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(30px,4vw,44px);font-weight:800;letter-spacing:-.025em;line-height:1.08;margin-bottom:8px}
h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:0}
small,.muted{color:var(--muted)}
p.muted{margin:0 0 22px;font-size:16px}
.help{font-size:13px;line-height:1.65;color:var(--muted)}
.hidden{display:none!important}
:focus-visible{outline:3px solid #a98bd6;outline-offset:2px}

/* ---------- Controls ---------- */
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:var(--r-sm);padding:11px 18px;background:#fff;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .2s var(--spring),background .2s,border-color .2s,box-shadow .2s}
button:active{transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--plum);color:#fff;box-shadow:0 8px 16px -8px #5a4380b3}
.soft{background:var(--lilac-2);color:var(--plum)}
.outline{background:#fff;border:1.5px solid var(--line);font-weight:600}
@media(hover:hover){.primary:hover{background:var(--plum-hi)}.soft:hover{background:#ddd0f0}.outline:hover{background:var(--lilac);border-color:#cdbbe6}}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px}
input,select,textarea{font:inherit;width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink)}
input[type=checkbox]{width:22px;height:22px;padding:0;margin:0;accent-color:var(--plum)}
label:has(input[type=checkbox]){display:flex;align-items:center;gap:10px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fields>*,.grid>*,.card{min-width:0}
.note{padding:13px 14px;border-radius:var(--r-sm);background:var(--lilac);font-size:13px;line-height:1.65}
.hours{min-width:0;margin:16px 0;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm)}
.hours legend{padding:0 6px;font-weight:800;color:var(--plum)}
.hours .help{margin:0 0 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:999px;background:var(--lilac)}
.seg-opt{position:relative;display:block;margin:0}
.seg-opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer}
.seg-opt span{display:block;padding:10px 6px;border-radius:999px;text-align:center;font-size:13.5px;font-weight:700;color:var(--muted);transition:background .2s,color .2s,box-shadow .2s}
.seg-opt input:checked+span{background:#fff;color:var(--plum);box-shadow:0 4px 10px -4px #5a438066}
.seg-opt input:focus-visible+span{outline:2px solid var(--plum);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 2px}
.chip{padding:8px 14px;border-radius:999px;background:var(--lilac-2);color:var(--plum);font-size:13px}
#hours-msg{min-height:1.2em;margin:10px 0 0}
#hours-msg.problem{color:var(--clay);font-weight:700}
[hidden]{display:none!important}
details{margin:16px 0;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm)}
summary{cursor:pointer;font-weight:700;font-size:14px}
.address-option{display:block;width:100%;margin-top:6px;padding:10px 12px;text-align:left;border:1.5px solid var(--line);border-radius:12px;font-weight:600;font-size:13px;line-height:1.5}
@media(hover:hover){.address-option:hover{background:var(--lilac)}}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100dvh}
.sidebar{position:sticky;top:0;align-self:start;height:100dvh;display:flex;flex-direction:column;gap:30px;padding:26px 16px;background:var(--lilac);border-right:1px solid var(--line)}
.brandwrap{display:flex;align-items:center;gap:12px;padding:0 6px}
.sprout{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:16px;background:var(--plum);color:#fff;transform:rotate(-6deg);box-shadow:0 8px 16px -8px #5a4380aa}
.sprout svg{width:26px;height:26px}
.brand{font-weight:800;font-size:19px;line-height:1.15;letter-spacing:-.02em;color:var(--plum)}
.brand span{display:block;margin-top:3px;font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted)}
nav{display:grid;gap:6px}
nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;background:transparent;border-radius:16px}
nav button b{display:grid;place-items:center;width:26px;height:26px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.active{background:var(--plum);color:#fff;box-shadow:0 8px 16px -10px #5a4380cc}
@media(hover:hover){nav button:not(.active):hover{background:#ebe0f7}}
.side-bottom{margin-top:auto;padding:0 8px;font-size:13px;line-height:1.7;color:var(--muted)}
.main{width:100%;max-width:1160px;margin:0 auto;padding:26px clamp(18px,4vw,44px) 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px;font-size:14px;font-weight:600;color:var(--muted)}
#saved{max-width:230px;text-align:right;font-size:13px}
.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--peach);color:var(--peach-ink);font-weight:800;border:3px solid #fff;box-shadow:var(--shadow)}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}
.intro p{margin:0;font-size:16px;color:var(--muted)}

/* ---------- Energy selector (sliding thumb) ---------- */
.energy{--i:0;position:relative;display:grid;grid-template-columns:repeat(3,1fr);min-width:270px;padding:4px;border-radius:999px;background:var(--lilac)}
.energy[data-pos="1"]{--i:1}.energy[data-pos="2"]{--i:2}
.energy:before{content:'';position:absolute;inset:4px auto 4px 4px;width:calc((100% - 8px)/3);border-radius:999px;background:#fff;box-shadow:0 4px 10px -4px #5a438066;transform:translateX(calc(var(--i)*100%));transition:transform .5s var(--spring)}
.energy button{position:relative;padding:9px 12px;background:transparent;border-radius:999px;font-size:14px;color:var(--muted)}
.energy button.selected{color:var(--plum)}

/* ---------- Day at a glance ---------- */
.day-stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.stat{display:inline-flex;align-items:center;gap:8px;padding:7px 16px 7px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;box-shadow:var(--shadow)}
.stat i{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--lilac-2);color:var(--plum);font-style:normal;font-size:14px}
.stat:nth-child(2) i{background:var(--peach);color:var(--peach-ink)}
.stat:nth-child(3) i{background:var(--sage);color:#4b673b}
.stat span{font-weight:600;color:var(--muted)}

/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:20px;align-items:start}
.grid>section,.grid>aside,.grid>div{display:grid;gap:20px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.empty{padding:24px 10px;text-align:center;color:var(--muted);line-height:1.8}
.empty:before{content:'';display:block;width:30px;height:30px;margin:0 auto 14px;border-radius:50% 0 50% 0;background:var(--leaf);opacity:.55;animation:bob 3.2s ease-in-out infinite}

/* ---------- Hero: the next little thing ---------- */
.focus{position:relative;overflow:hidden;min-height:300px;padding:30px;border:0;border-radius:var(--r-lg);color:#fff;background:linear-gradient(145deg,#4f3a75,#7a5fa8);box-shadow:0 20px 36px -20px #5a4380e6}
.focus:before{content:'';position:absolute;right:-90px;top:-100px;width:300px;height:300px;border-radius:50%;background:#ffffff0e}
.focus>*{position:relative;z-index:1}
.focus>.focus-art{position:absolute;z-index:0;right:18px;bottom:-4px;width:clamp(150px,22vw,220px);pointer-events:none}
.focus h2{max-width:62%;margin:16px 0 8px;font-size:clamp(24px,3vw,32px);line-height:1.18;letter-spacing:-.02em}
.focus p{max-width:62%;margin:0;font-size:15px;color:#eadff7}
.focus .help{color:#d9c9ee}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;background:#ffffff1f;color:#f4ecfb;font-size:13px;font-weight:700}
.tag:before{content:'';width:7px;height:7px;border-radius:50%;background:#cfe6a8;animation:pulse 3s ease-in-out infinite}
.focus .actions{max-width:84%;margin-top:22px}
.focus .actions button{padding:10px 16px}
.focus .actions button,.focus>button{background:#ffffff1f;color:#fff;border:1px solid #ffffff30}
.focus .actions .primary,.focus>.primary{background:var(--peach);color:#4d3560;border-color:var(--peach);box-shadow:0 8px 16px -8px #0007}
@media(hover:hover){.focus .actions button:hover,.focus>button:hover{background:#ffffff33}.focus .actions .primary:hover,.focus>.primary:hover{background:#fbe6d2}}
.focus .grow-note{max-width:62%;margin-top:20px;font-size:13px;font-weight:600;color:#d9c9ee}

/* ---------- The plant ---------- */
.plant{display:block;width:100%;height:auto;overflow:visible}
.plant[data-stage="0"]{--stem:.4;--a:.55;--b:.55;--c:0;--d:0;--bud:0;--bloom:0}
.plant[data-stage="1"]{--stem:.62;--a:1;--b:1;--c:0;--d:0;--bud:0;--bloom:0}
.plant[data-stage="2"]{--stem:.82;--a:1;--b:1;--c:1;--d:0;--bud:0;--bloom:0}
.plant[data-stage="3"]{--stem:1;--a:1;--b:1;--c:1;--d:1;--bud:1;--bloom:0}
.plant[data-stage="4"]{--stem:1;--a:1;--b:1;--c:1;--d:1;--bud:0;--bloom:1}
.plant-sway{transform-box:view-box;transform-origin:80px 118px;animation:sway 5.5s ease-in-out infinite}
.stem,.lf,.bud,.bloom{transform-box:fill-box;transition:transform .8s var(--spring)}
.stem{transform-origin:50% 100%;transform:scaleY(var(--stem))}
.lf-a,.lf-c{transform-origin:100% 100%}.lf-b,.lf-d{transform-origin:0 100%}
.lf-a{transform:scale(var(--a))}.lf-b{transform:scale(var(--b))}.lf-c{transform:scale(var(--c))}.lf-d{transform:scale(var(--d))}
.bud,.bloom{transform-origin:50% 50%}
.bud{transform:scale(var(--bud))}
.bloom{transform:scale(var(--bloom)) rotate(calc((1 - var(--bloom))*-70deg))}
.sun-float{animation:float 6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 7s linear infinite}
.pot .blink{animation-delay:-3s}
.spark{opacity:0;transition:opacity .6s}
.plant[data-stage="4"] .spark{opacity:1;animation:twinkle 2.4s ease-in-out infinite}
.is-celebrating .plant-sway{animation:cheer .85s ease-in-out}

/* ---------- Tasks ---------- */
.tasks-card>.row{margin-bottom:6px}
.tasks-card>.row button{padding:8px 15px;border-radius:999px;font-size:13px}
.task{display:flex;align-items:flex-start;gap:12px;margin-top:10px;padding:14px 12px 14px 14px;border-radius:var(--r-sm);background:var(--lilac);transition:transform .25s var(--ease),background .25s,opacity .25s}
.task.priority-1{background:var(--peach-bg)}
.task.priority-3{background:#f4f9ee}
.task.done{background:#f6f4f7;opacity:.78}
.task-info{flex:1;min-width:0}
.task strong{display:block;margin-bottom:6px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.task.done strong{color:var(--muted);text-decoration:line-through;text-decoration-color:#b8a9cf}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:999px;background:var(--lilac-2);color:var(--plum);font-size:11px;font-weight:700;vertical-align:1px}
.task-menu{flex:none;padding:6px 12px;border-radius:999px;background:transparent;color:var(--plum);font-size:13px}
.check{position:relative;flex:none;width:28px;height:28px;margin-top:1px;padding:0;display:grid;place-items:center;border-radius:50%;background:#fff;border:2px solid #cdbde4}
.check:after{content:'';position:absolute;inset:-9px}
.check svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24}
.task.done .check{background:var(--leaf);border-color:var(--leaf)}
.just-done .check{animation:pop .5s var(--spring)}
.just-done .check svg{animation:draw .35s .1s ease-out both}
@media(hover:hover){.task:hover{transform:translateY(-1px)}.check:hover{border-color:var(--plum);transform:scale(1.08)}.task-menu:hover{background:var(--lilac-2)}}
#alltasks .task{content-visibility:auto;contain-intrinsic-size:auto 78px}

/* ---------- Timeline ---------- */
.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:18px;padding:5px;border-radius:18px;background:var(--lilac)}
.day{padding:8px 0;border-radius:14px;background:transparent;color:var(--muted);font-size:12px;text-align:center}
.day span{display:block;margin-top:4px;font-size:16px;font-weight:800;color:var(--ink)}
.day.current{background:var(--plum);color:#dccdf0;box-shadow:0 6px 12px -6px #5a4380aa}
.day.current span{color:#fff}
.timeline-item{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;margin-bottom:10px}
.timeline-item:before{content:'';position:absolute;left:68px;top:24px;bottom:-14px;border-left:2px dotted #dacbe9}
.timeline-item:last-of-type:before{display:none}
.time{position:relative;padding-top:12px;font-size:12px;font-weight:700;color:var(--muted)}
.time:after{content:'';position:absolute;right:-9px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--plum);border:2px solid #fff;box-shadow:0 0 0 1.5px #cdbde4}
.block{margin-left:8px;padding:11px 14px;border-radius:var(--r-sm);background:var(--sage);line-height:1.45}
.block.fixed{background:var(--lilac-2)}
.block.travel{background:var(--peach-bg);border:1.5px dashed #e8c8a6}
.block strong{display:block;font-size:14px;font-weight:700}
.block small{font-size:12px}
.block .help{margin:4px 0 0;font-size:12px}

/* ---------- Brain dump & nearby ---------- */
.dump{background:var(--peach-bg);border-color:#f3dfcc}
.dump h2{color:var(--peach-ink)}
.dump p{margin:0 0 12px;font-size:13px;color:#8a6552}
.dump textarea{min-height:110px;resize:vertical;line-height:1.7;background:#ffffffb3;border-color:#f0d9c4}
.dump .primary{margin-top:12px;background:#a4694d;box-shadow:0 8px 16px -8px #a4694dbb}
.nearby{background:var(--lilac);border-color:var(--lilac-2);box-shadow:none}
.nearby h2{margin:0 0 6px;font-size:18px}
.nearby .help{margin:0 0 6px}
.nearby .row{margin-top:12px}

/* ---------- Footer, toast, loading ---------- */
.footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 18px;margin-top:34px;font-size:13px;color:var(--muted)}
.footer button{padding:8px 6px;background:transparent;font-size:13px;color:var(--plum)}
.toast{position:fixed;z-index:60;bottom:24px;left:50%;translate:-50% 0;max-width:min(92vw,520px);padding:13px 22px;border-radius:16px;background:#3d3052;color:#fff;font-weight:600;line-height:1.5;box-shadow:0 14px 30px -12px #2a1a4a99;animation:toast-in .4s var(--spring)}
.sync-loading #view{pointer-events:none;opacity:.55}
.sync-loading #view:before{content:"Loading your saved planner…";display:block;margin-bottom:14px;padding:14px;border-radius:var(--r-sm);background:var(--lilac);font-weight:700}
.mobile-add{display:none}

/* ---------- Dialogs ---------- */
dialog{width:min(540px,92vw);max-height:calc(100dvh - 32px);padding:26px;overflow:auto;overscroll-behavior:contain;border:0;border-radius:var(--r-lg);background:#fff;color:var(--ink);box-shadow:0 30px 80px -20px #2a1a4a66}
dialog[open]{animation:dialog-in .4s var(--spring)}
dialog::backdrop{background:#2a1c4a66;animation:fade .25s ease-out}
dialog h2{margin:0 0 6px;font-size:24px;line-height:1.25}
.dialog-close{float:right;position:sticky;top:0;z-index:3;width:44px;height:44px;margin:-8px -8px 4px 8px;padding:0;border-radius:50%;background:var(--lilac);color:var(--plum);font-size:24px;line-height:1}
.dialog-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:24px}

/* ---------- Entrance: one orchestrated moment per view ---------- */
#view.enter-scene .intro,#view.enter-scene .day-stats,#view.enter-scene .card{animation:arrive .55s var(--ease) both}
#view.enter-scene .day-stats{animation-delay:40ms}
#view.enter-scene .focus{animation-delay:80ms}
#view.enter-scene .tasks-card{animation-delay:150ms}
#view.enter-scene .overview-card{animation-delay:200ms}
#view.enter-scene .dump{animation-delay:240ms}
#view.enter-scene .nearby{animation-delay:280ms}

/* ---------- Celebration petals (spawned by celebrate()) ---------- */
.celebration{position:fixed;inset:0;z-index:70;overflow:hidden;pointer-events:none}
.celebration-petal{position:absolute;width:8px;height:12px;border-radius:2px 7px 2px 7px;box-shadow:0 1px 2px #5b407411;animation:petal-burst 1.05s cubic-bezier(.13,.6,.3,1) var(--delay) both}

/* ---------- Keyframes ---------- */
@keyframes arrive{from{opacity:0;transform:translateY(14px)}}
@keyframes dialog-in{from{opacity:0;transform:translateY(18px) scale(.94)}}
@keyframes sheet-in{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes toast-in{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes fab-in{from{opacity:0;transform:scale(.6) translateY(20px)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #cfe6a860}50%{box-shadow:0 0 0 6px #cfe6a800}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(6deg)}}
@keyframes cheer{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-7deg) scale(1.05)}60%{transform:rotate(6deg) scale(1.08)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:24}}
@keyframes petal-burst{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.5)}12%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.6)}}

/* ---------- Tablet ---------- */
@media(max-width:1000px){
  .app{grid-template-columns:224px minmax(0,1fr)}
  .intro{display:block}
  .intro>div+div{margin-top:16px}
  .energy{max-width:380px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .focus h2,.focus p,.focus .grow-note{max-width:58%}
}
@media(min-width:1600px){.main{max-width:1240px}}

/* ---------- Phone ---------- */
@media(max-width:760px){
  .app{display:block}
  .sidebar{position:static;height:auto;display:block;padding:14px 18px 4px;background:transparent;border:0}
  .brandwrap{padding:0}
  .sprout{width:38px;height:38px;border-radius:13px}.sprout svg{width:22px;height:22px}
  .brand span,.side-bottom{display:none}
  nav{position:fixed;inset:auto 0 0;z-index:30;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-radius:22px 22px 0 0;background:#fff;box-shadow:0 -10px 30px -18px #3c285a66}
  nav button{flex-direction:column;justify-content:center;gap:2px;min-height:56px;padding:6px 2px 4px;border-radius:16px;background:transparent!important;box-shadow:none!important;color:var(--muted);font-size:11px;text-align:center}
  nav button b{width:48px;height:30px;border-radius:15px;transition:background .25s,transform .3s var(--spring)}
  nav button.active{color:var(--plum)}
  nav button.active b{background:var(--lilac-2);transform:translateY(-1px)}
  .main{padding:10px 16px calc(160px + env(safe-area-inset-bottom))}
  .top{margin-bottom:14px;font-size:13px}
  #saved{max-width:150px;font-size:12px;line-height:1.4}
  .avatar{display:none}
  .intro{display:block;margin-bottom:16px}
  .intro p{font-size:15px}
  .intro>div+div{margin-top:16px}
  .energy{width:100%;min-width:0}
  .day-stats{gap:8px}
  .stat{gap:6px;padding:5px 11px 5px 5px;font-size:13px}
  .stat i{width:26px;height:26px}
  .stat .lil{display:none}
  .grid{grid-template-columns:minmax(0,1fr);gap:16px}
  .day-grid>section,.day-grid>aside{display:contents}
  .day-grid .focus{order:1}.day-grid .tasks-card{order:2}.day-grid .overview-card{order:3}.day-grid .dump{order:4}.day-grid .nearby{order:5}
  .card{padding:18px;border-radius:20px}
  .focus{min-height:0;padding:22px 20px;border-radius:24px}
  .focus>.focus-art{top:14px;right:10px;bottom:auto;width:108px}
  .focus h2,.focus p{max-width:calc(100% - 110px)}
  .focus h2{font-size:24px}
  .focus p{font-size:14px}
  .focus .actions{max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .focus .actions button{min-height:46px;padding:10px 8px}
  .focus .grow-note{max-width:none}
  .task-menu{min-height:44px}
  .timeline-item{grid-template-columns:58px minmax(0,1fr)}
  .timeline-item:before{left:62px}
  .head{flex-wrap:wrap}
  input,select,textarea{min-height:48px;font-size:16px}
  .dump textarea{min-height:120px}
  .dump .primary{width:100%;min-height:48px}
  input[type=checkbox]{min-height:0}
  label:has(input[type=checkbox]){min-height:44px}
  .fields{gap:12px}
  .footer{flex-direction:column;align-items:flex-start;gap:4px}
  .mobile-add{display:grid;place-items:center;position:fixed;z-index:25;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;min-height:56px;padding:0;border-radius:50%;background:var(--plum);color:#fff;font-size:32px;font-weight:600;line-height:1;box-shadow:0 14px 26px -10px #5a4380;animation:fab-in .5s .4s var(--spring) both}
  .mobile-add span{display:none}
  .tasks-card>.row{gap:6px}
  .tasks-card>.row button{padding:8px 12px;font-size:12.5px}
  .toast{bottom:calc(148px + env(safe-area-inset-bottom));width:max-content;max-width:calc(100vw - 32px);font-size:14px}
  /* dialogs become bottom sheets */
  dialog{width:100%;max-width:none;max-height:92dvh;margin:auto 0 0;padding:20px 20px 0;border-radius:26px 26px 0 0}
  dialog[open]{animation:sheet-in .42s var(--ease)}
  dialog h2{font-size:22px}
  .dialog-actions{position:sticky;bottom:0;z-index:2;margin:20px -20px 0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  .dialog-actions button{flex:1;min-width:70px;min-height:48px}
  .dialog-actions .primary{flex:2}
}
@media(max-width:380px){.main{padding-inline:12px}.fields{grid-template-columns:minmax(0,1fr)}.focus>.focus-art{width:78px}.focus h2,.focus p{max-width:calc(100% - 82px)}.energy button{padding-inline:6px;font-size:13px}}
@media(pointer:coarse){button,summary,.address-option{min-height:44px}.check{min-height:28px}.day{min-height:56px}}

/* ---------- Motion preferences ---------- */
html[data-paused] *,html[data-paused] *:before,html[data-paused] *:after{animation-play-state:paused!important}
html[data-motion=off] *,html[data-motion=off] *:before,html[data-motion=off] *:after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.celebration{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brandwrap">
      <div class="sprout" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6Z"/><path d="M12 15c0-3-2.5-5-6-5 0 3 2.5 5 6 5Z"/></svg></div>
      <div class="brand">little by little<span>Your day, gently.</span></div>
    </div>
    <nav aria-label="Main">
      <button data-view="today" class="active"><b><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></b>My day</button>
      <button data-view="tasks"><b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg></b>All tasks</button>
      <button data-view="calendar"><b><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></b>Calendar</button>
      <button data-view="settings"><b><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></b>My rhythm</button>
    </nav>
    <div class="side-bottom">One thing at a time.<br>A little progress counts.</div>
  </aside>
  <main class="main">
    <div class="top">
      <span id="dateline"></span>
      <div class="row"><span class="help" id="saved">Loading saved planner…</span><div class="avatar" aria-hidden="true">S</div></div>
    </div>
    <div id="view"></div>
    <div class="footer">
      <span>Made for your real life, not your perfect day.</span>
      <span class="row"><button class="motion-toggle" onclick="toggleMotion()" aria-pressed="true">Pause animations</button><button onclick="undo()">Undo last change</button></span>
    </div>
  </main>
</div>
<button class="mobile-add" onclick="edit()" aria-label="Add a task">+ <span>Add task</span></button>
<dialog id="modal"></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script src="account-storage.js"></script>
<script src="route-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
