<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#70558e"><title>Little by Little · Your day, gently</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top right,#e5d5f5,transparent 65%),#faf7f3;color:#493a5b;font:16px system-ui,sans-serif}.welcome{width:min(900px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}.brand{font:25px Georgia,serif;margin-bottom:40px}.flower{display:inline-block;color:#9679a6;font-size:42px;animation:turn 22s linear infinite}h1{font:clamp(42px,6vw,68px)/1.08 Georgia,serif;letter-spacing:-2px;margin:20px 0}h1 em{font-weight:normal;color:#987bab}p{color:#81708b;line-height:1.8}.auth{padding:30px;border:1px solid #e4d8ec;background:#ffffffd9;border-radius:26px;box-shadow:0 8px 0 #e7ddec,0 20px 50px #70558e12}h2{font:29px Georgia,serif;margin:0 0 12px}label{display:block;font-size:13px;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #d8c9e1;border-radius:12px;font:inherit;min-height:48px}button{font:inherit;border:0;min-height:48px;padding:13px 18px;border-radius:12px;cursor:pointer;background:#70558e;color:#fff}.primary{width:100%;margin-top:22px;box-shadow:0 4px 0 #57406f}.links{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.links button{font-size:13px;padding:8px;background:#f1ebf7;color:#70558e;flex:1}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #b99aca;outline-offset:3px}#message{font-size:13px;line-height:1.7;min-height:24px;color:#70558e}small{font-size:12px;line-height:1.7;color:#81708b}.hidden{display:none!important}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:650px){.welcome{grid-template-columns:1fr;gap:20px}.brand{margin-bottom:20px}h1{font-size:42px}.auth{padding:24px}}
</style></head><body><main class="welcome" id="welcome"><section><div class="brand"><span class="flower" aria-hidden="true">✳</span> little by little</div><h1>A little room<br><em>for real life.</em></h1><p>Your tasks, your pace.<br>Come back to the little things you saved.</p><small>Your planner stays private to your account.</small></section><section class="auth"><h2 id="auth-title">Welcome back.</h2><p id="auth-intro">Sign in to pick up where you left off.</p><form id="auth-form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button class="primary" id="submit">Sign in ↗</button></form><div class="links"><button id="signup" type="button">Create account</button><button id="forgot" type="button">Forgot password?</button></div><p id="message" role="status" aria-live="polite">Loading your planner…</p></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="transport.js"></script><script src="auth.js"></script></body></html>
