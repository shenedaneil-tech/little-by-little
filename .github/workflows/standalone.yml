name: Standalone planner checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node standalone/build.mjs
      - run: node --test standalone/server.test.mjs tests/route-engine.test.mjs
